  <header class="site-header" data-header>

        <img src="img/sd-gold.svg" alt="" width="290" height="208">
      </a>

      <nav class="nav" data-i18n-attr="aria-label:a11y.nav">
        <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-list" data-nav-toggle>
          <span class="nav__toggle-icon" aria-hidden="true"></span>
          <span data-i18n="nav.menu" data-nav-label></span>
        </button>
        <ul class="nav__list" id="nav-list" data-nav-list>
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#projects" data-i18n="nav.projects"></a></li>
          <li><a href="#experience" data-i18n="nav.experience"></a></li>

          <li><a href="#skills" data-i18n="nav.skills"></a></li>
          <li><a href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>

      <div class="lang" role="group" data-i18n-attr="aria-label:a11y.language">
        <button type="button" lang="en" data-lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" lang="es" data-lang="es" aria-label="Español" aria-pressed="false">ES</button>
        <button type="button" lang="fr" data-lang="fr" aria-label="Français" aria-pressed="false">FR</button>
      </div>
    </div>

  <main id="main" tabindex="-1">
    <section class="hero wrap" id="top" aria-labelledby="hero-name">
      <div class="hero__plate">
        <div class="hero__text">
          <h1 class="hero__name" id="hero-name">Santiago Die Morejón</h1>
          <span class="hero__rule" aria-hidden="true"></span>
          <p class="hero__role" data-i18n="hero.role"></p>
          <div class="hero__actions">
            <a class="button button--primary" href="#projects" data-i18n="hero.ctaProjects"></a>
            <a class="button button--quiet" href="#contact" data-i18n="hero.ctaContact"></a>
          </div>
        </div>
        <div class="hero__mark" aria-hidden="true">
          <img src="img/sd-gold.svg" alt="" width="290" height="208">
        </div>
      </div>
    </section>

    <section class="section wrap reveal" id="about" aria-labelledby="about-title">
      <h2 class="section__title" id="about-title" data-i18n="about.title"></h2>
      <div class="section__body prose" data-render="about"></div>
    </section>

    <section class="section wrap reveal" id="projects" aria-labelledby="projects-title">
      <h2 class="section__title" id="projects-title" data-i18n="projects.title"></h2>
      <div class="section__body">
        <p class="status" data-projects-status role="status"></p>

    <section class="section wrap reveal" id="experience" aria-labelledby="experience-title">

    <section class="section wrap reveal" id="skills" aria-labelledby="skills-title">

      <div class="section__body">

      <div class="section__body">
        <p class="lead" data-i18n="contact.text"></p>
        <ul class="contact">

              <span class="contact__value">github.com/santiagodie</span>
              <svg class="icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M5 11 11 5M6 5h5v5"/></svg>
              <span class="visually-hidden" data-i18n="a11y.newTab"></span>
            </a>
          </li>
          <li>
            <a class="contact__link" href="https://www.linkedin.com/in/santiago-die-morejon" target="_blank" rel="noopener">

              <span class="contact__value">linkedin.com/in/santiago-die-morejon</span>
              <svg class="icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M5 11 11 5M6 5h5v5"/></svg>
              <span class="visually-hidden" data-i18n="a11y.newTab"></span>
            </a>
          </li>
          <li data-render="cv"></li>
        </ul>
