name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Renders /, /es/ and /fr/ from src/, i18n/ and data/ into dist/. Fails if a
      # translation is missing, so a page with gaps is never deployed.
      - name: Build site
        run: |
          python tools/build.py
          find dist -type f | sort

      # The CV in PDF, one A4 page per language (Harvard layout, tools/cv/cv.css),
      # printed by the runner's Chrome from the same i18n/ and data/ as the site, so it
      # can never fall behind it. make_cv.py checks each PDF (one page, under 300 KB,
      # the photo where it belongs, links, title, language) and fails the deploy rather
      # than publish a broken CV. The phone number exists only here: the CV_PHONE secret
      # reaches this step alone, and make_cv.py fails if it shows up anywhere else in
      # dist/. Without the secret the CV goes without a phone (a warning, not a failure).
      - name: Make the CV (PDF)
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}
        run: python tools/make_cv.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
