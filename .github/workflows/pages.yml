name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the website is published. Design docs, skill files, tools and the
      # README banner stay in the repository.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html favicon.ico favicon.svg apple-touch-icon.png og-image.png CNAME css js img data i18n _site/
          if [ -d cv ]; then cp -r cv _site/; fi
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
