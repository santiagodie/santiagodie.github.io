name: CV check (no deploy)

# Builds the site and the CV PDFs on the runner, exactly as the Pages workflow does,
# and keeps the PDFs as an artifact to compare with a local run. It never deploys, and
# it never gets the CV_PHONE secret: these PDFs are made without the phone number.
on:
  workflow_dispatch:
  push:
    branches: ["mejoras/**"]
    paths: ["tools/cv/**", "fonts/print/**", "tools/make_cv.py", "tools/build.py", "i18n/**", "data/**"]

permissions:
  contents: read

jobs:
  cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python tools/build.py

      - name: Install the PDF checkers
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qpdf poppler-utils

      - name: Make the CV (PDF)
        run: |
          google-chrome --version
          start=$(date +%s)
          python tools/make_cv.py | tee cv-report.txt
          echo "seconds=$(( $(date +%s) - start ))" >> cv-report.txt
          while read -r line; do echo "::notice title=CV::$line"; done < cv-report.txt

      - name: Keep the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            dist/cv/*.pdf
            cv-report.txt
          retention-days: 7
