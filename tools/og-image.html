<!doctype html>
<!-- Source for og-image.png (1200x630). Regenerate with the command in README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #FFFFFF; overflow: hidden; }
  body { position: relative; color: #0B1F3A; font-family: "Hubot Sans", sans-serif; }
  .frame { position: absolute; inset: 28px; border: 1.5px solid rgb(201 162 39 / 0.75); border-radius: 18px; }
  .text { position: absolute; left: 92px; top: 92px; width: 740px; }
  h1 { margin: 0; font-size: 104px; font-weight: 750; font-stretch: 112%; line-height: 0.9; letter-spacing: -0.035em; }
  .label { margin: 44px 0 14px; color: rgb(11 31 58 / 0.66); font: 400 18px "JetBrains Mono", monospace; }
  .tokens { display: flex; flex-wrap: wrap; gap: 10px 8px; }
  .word { display: flex; gap: 2px; }
  .tok { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tok b { display: block; padding: 5px 9px; font: 500 20px "JetBrains Mono", monospace; border: 1.5px solid rgb(201 162 39 / 0.6); border-radius: 7px; white-space: pre; }
  .tok:first-child b.first { border-color: #C9A227; }
  .tok i { color: rgb(11 31 58 / 0.66); font: normal 400 14px "JetBrains Mono", monospace; }
  .url { position: absolute; left: 92px; bottom: 70px; color: rgb(11 31 58 / 0.66); font: 400 20px "JetBrains Mono", monospace; }
  .divider { position: absolute; left: 860px; top: 92px; bottom: 92px; width: 1.5px; background: rgb(201 162 39 / 0.55); }
  .mark { position: absolute; left: 862px; right: 28px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .mark img { width: 210px; height: auto; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="text">
    <h1>Santiago<br>Die Morejón</h1>
    <p class="label">tokenize()</p>
    <div class="tokens">
      <span class="word"><span class="tok"><b class="first">Computer</b><i>38432</i></span></span>
      <span class="word"><span class="tok"><b>Engineer</b><i>29483</i></span></span>
      <span class="word"><span class="tok"><b>·</b><i>9787</i></span></span>
      <span class="word"><span class="tok"><b>AI</b><i>15592</i></span></span>
      <span class="word"><span class="tok"><b>&amp;</b><i>612</i></span></span>
      <span class="word"><span class="tok"><b>ML</b><i>20187</i></span></span>
      <span class="word"><span class="tok"><b>·</b><i>9787</i></span></span>
      <span class="word"><span class="tok"><b>M</b><i>386</i></span><span class="tok"><b>LO</b><i>1623</i></span><span class="tok"><b>ps</b><i>1725</i></span></span>
    </div>
  </div>
  <div class="url">santiagodie.com</div>
  <div class="divider"></div>
  <div class="mark"><img src="../img/sd-navy.svg" alt=""></div>
</body>
</html>
