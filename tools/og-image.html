<!doctype html>

<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Mona+Sans:wdth,wght@100..125,400..700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0B1F3A; overflow: hidden; }

  h1 { margin: 0; font-size: 84px; font-weight: 600; font-stretch: 108%; line-height: 1; letter-spacing: -0.03em; }
  .rule { width: 56px; height: 2px; margin: 40px 0 30px; background: #C9A227; opacity: 0.8; }
  p { margin: 0; color: #C9A227; font-size: 32px; font-weight: 450; }
  .url { position: absolute; left: 120px; bottom: 92px; color: rgb(245 240 225 / 0.6); font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: 0.02em; }
  .divider { position: absolute; left: 852px; top: 130px; bottom: 130px; width: 1px; background: rgb(201 162 39 / 0.45); }
  .mark { position: absolute; left: 852px; right: 40px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .mark img { width: 190px; height: auto; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="text">

</html>
